name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  test:
    name: E2E Tests
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          NODE_ENV: development
          PORT: 3000
          S3_REGION: us-east-1
          S3_BUCKET_NAME: ""
          S3_FORCE_PATH_STYLE: "true"
          SENTRY_DSN: ""
          OTEL_EXPORTER_OTLP_ENDPOINT: ""
          REQUEST_TIMEOUT_MS: "30000"
          RATE_LIMIT_WINDOW_MS: "60000"
          RATE_LIMIT_MAX_REQUESTS: "100"
          CORS_ORIGINS: "*"
          DOWNLOAD_DELAY_ENABLED: "false"

  build-and-push:
    name: Build & Deploy
    runs-on: ubuntu-24.04
    needs: [test]
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      # Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push all required images with commit SHA tag
      - name: Build and push delineate-gateway image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: docker/Dockerfile.gateway
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/delineate-gateway:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/delineate-gateway:latest

      - name: Build and push delineate-app image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: docker/Dockerfile.prod
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/delineate-app:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/delineate-app:latest

      - name: Build and push delineate-dashboard image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: ./frontend
          file: frontend/Dockerfile
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/delineate-dashboard:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/delineate-dashboard:latest

