name: delineate

services:
  delineate-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    environment:
      - NODE_ENV=development
      - PORT=3000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://delineate-jaeger:4318
      - S3_ENDPOINT=http://rustfs:9000
      - S3_ACCESS_KEY_ID=rustfsadmin
      - S3_SECRET_ACCESS_KEY=rustfsadmin
      - S3_BUCKET_NAME=downloads
      - S3_FORCE_PATH_STYLE=true
      - S3_MOCK_MODE=true
      - DOWNLOAD_DELAY_ENABLED=true
      - DOWNLOAD_DELAY_MIN_MS=5000
      - DOWNLOAD_DELAY_MAX_MS=15000
      - REQUEST_TIMEOUT_MS=30000
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=100
      - CORS_ORIGINS=*
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
      delineate-jaeger:
        condition: service_started

  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs

  rustfs-init:
    image: minio/mc:latest
    depends_on:
      - rustfs
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      mc alias set myrustfs http://rustfs:9000 rustfsadmin rustfsadmin;
      mc mb myrustfs/downloads --ignore-existing;
      exit 0;
      "

  delineate-jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  delineate-dashboard:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    environment:
      - VITE_SENTRY_DSN=${SENTRY_DSN:-}
      - VITE_OTEL_EXPORTER_OTLP_ENDPOINT=http://delineate-jaeger:4318
      - VITE_JAEGER_UI_URL=http://localhost:16686
    depends_on:
      - delineate-app
      - delineate-jaeger
    restart: unless-stopped

volumes:
  rustfs-data:
  rustfs-logs:
