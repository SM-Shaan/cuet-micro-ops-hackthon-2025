name: delineate

services:
  delineate-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    ports:
      - "80:80"
    depends_on:
      delineate-app:
        condition: service_healthy
      delineate-dashboard:
        condition: service_started
    restart: unless-stopped
    networks:
      - delineate-network

  delineate-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    expose:
      - "3000"
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - S3_ENDPOINT=http://rustfs:9000
      - S3_ACCESS_KEY_ID=rustfsadmin
      - S3_SECRET_ACCESS_KEY=rustfsadmin
      - S3_BUCKET_NAME=downloads
      - S3_FORCE_PATH_STYLE=true
      - DOWNLOAD_DELAY_ENABLED=true
      - DOWNLOAD_DELAY_MIN_MS=10000
      # - DOWNLOAD_DELAY_MAX_MS=120000
      - DOWNLOAD_DELAY_MAX_MS=12000
      - REQUEST_TIMEOUT_MS=30000
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=100
      - CORS_ORIGINS=*
      - REDIS_URL=redis://redis:6379
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - delineate-network

  rustfs:
    image: rustfs/rustfs:latest
    expose:
      - "9000"
      - "9001"
    environment:
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs
    restart: unless-stopped
    networks:
      - delineate-network

  rustfs-init:
    image: minio/mc:latest
    depends_on:
      - rustfs
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      mc alias set myrustfs http://rustfs:9000 rustfsadmin rustfsadmin;
      mc mb myrustfs/downloads --ignore-existing;
      exit 0;
      "
    networks:
      - delineate-network

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - delineate-network

  delineate-dashboard:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    env_file:
      - ../.env
    environment:
      - VITE_SENTRY_DSN=${SENTRY_DSN:-}
      - VITE_OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - VITE_JAEGER_UI_URL=${JAEGER_UI_URL:-}
    restart: unless-stopped
    networks:
      - delineate-network

networks:
  delineate-network:
    driver: bridge

volumes:
  rustfs-data:
  rustfs-logs:
  redis-data:
