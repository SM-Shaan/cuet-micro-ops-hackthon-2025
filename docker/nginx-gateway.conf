# Simple Nginx API Gateway Configuration
# This is intentionally kept simple to demonstrate timeout issues

# Backend upstream
upstream backend {
    server delineate-app:3000;
}

# Frontend upstream
upstream frontend {
    server delineate-dashboard:80;
}

server {
    listen 80;
    server_name _;
    
    # Access and error logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
    
    # Gateway health check endpoint
    location = /gateway-health {
        access_log off;
        return 200 "Gateway OK\n";
        add_header Content-Type text/plain;
    }
    
    # API routes - simple proxy to backend
    # This will timeout on long-running requests (demonstrating the problem!)
    location /api/ {
        # Strip /api prefix when proxying
        rewrite ^/api/(.*) /$1 break;
        
        # Simple proxy to backend
        proxy_pass http://backend;
        proxy_http_version 1.1;
        
        # Basic headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Short timeouts to demonstrate the problem
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # Frontend - proxy all other requests to the dashboard service
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        
        # Basic headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (if needed in future)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

